version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3003:3003"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

